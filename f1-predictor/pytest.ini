[pytest]
asyncio_mode = auto
# Pin the fixture loop scope so pytest-asyncio does not emit an unset-config
# deprecation warning and behaviour stays stable across plugin upgrades.
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = backend

# Narrowly scoped ignores for third-party import-time deprecations that we
# cannot fix (shap's bundled matplotlib colormap helpers). Deliberately module
# scoped so any new warning raised by first-party code still surfaces.
filterwarnings =
    ignore:Converting `np.inexact` or `np.floating` to a dtype is deprecated:DeprecationWarning:shap.plots.colors.*
    ignore:The set_bad function will be deprecated in a future version:PendingDeprecationWarning:shap.plots.colors.*
    ignore:The set_over function will be deprecated in a future version:PendingDeprecationWarning:shap.plots.colors.*
    ignore:The set_under function will be deprecated in a future version:PendingDeprecationWarning:shap.plots.colors.*
